[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "erius-phone-mcp"
version = "0.1.1"
description = "MCP server that gives your AI agent a real Android phone (ERIUS PHONE): read the screen, tap, type, launch apps, read crash logs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ERIUS", email = "info@eriusphone.com" }]
maintainers = [{ name = "ERIUS", email = "info@eriusphone.com" }]
keywords = [
    "mcp", "model-context-protocol", "android", "ai-agent", "llm", "claude",
    "cursor", "mobile-testing", "qa", "adb", "erius", "erius-phone",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=4.0.10,<5",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://eriusphone.com"
Documentation = "https://eriusphone.com/docs.html"
Repository = "https://github.com/Protremix/erius-phone-mcp"
Issues = "https://github.com/Protremix/erius-phone-mcp/issues"

[project.scripts]
erius-phone-mcp = "erius_phone_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erius_phone_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
